syntax = "proto3";

package holdings;

service KiteService {
  rpc GetHoldings(HoldingsRequest) returns (HoldingsResponse);
  rpc StreamLiveTicks(LiveTicksRequest) returns (stream LiveTick);
  rpc StreamUnifiedUpdates(UnifiedUpdateRequest) returns (stream UnifiedUpdate);
  rpc GetMargins(MarginsRequest) returns (MarginsResponse);
  rpc GetCashTransactions(CashTransactionsRequest) returns (CashTransactionsResponse);
  rpc GetPortfolioValuation(PortfolioValuationRequest) returns (PortfolioValuationResponse);
}

message PortfolioValuationRequest {}

message PortfolioValuationResponse {
  double current_value = 1;
  double available_funds = 2;
  double xirr = 3;
  repeated CashTransaction transactions = 4;
}

message MarginsRequest {}

message MarginsResponse {
  double available_cash = 1;
}

message CashTransactionsRequest {}

message CashTransaction {
  string date = 1;
  double amount = 2;
  string type = 3;
}

message CashTransactionsResponse {
  repeated CashTransaction transactions = 1;
}


message UnifiedUpdateRequest {
}

message UnifiedUpdate {
  string payload = 1;
}

message HoldingsRequest {
  // Empty request for now, or we can include user_id if needed
}

message Holding {
  string tradingsymbol = 1;
  string exchange = 2;
  string instrument_token = 3;
  int32 quantity = 4;
  double average_price = 5;
  double last_price = 6;
  double pnl = 7;
}

message HoldingsResponse {
  repeated Holding holdings = 1;
  bool fallback = 2;
}

message LiveTicksRequest {
  // Client can send a request to start receiving ticks.
  // Can add instrument tokens here if needed.
}

message LiveTick {
  string instrument_token = 1;
  double last_price = 2;
  int64 volume = 3;
  double buy_quantity = 4;
  double sell_quantity = 5;
  double open_interest = 6;
  string timestamp = 7;
}
